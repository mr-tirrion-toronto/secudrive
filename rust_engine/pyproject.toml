[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "secudrive_rust"
version = "0.1.0"
description = "Compiled scan engine (walk + hash) for SecuDrive"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.maturin]
bindings = "pyo3"
module-name = "secudrive_rust"
python-source = "."